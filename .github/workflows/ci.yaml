name: ci

on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "*"

jobs:
  lint:
    defaults:
      run:
        shell: bash .github/vorpal-shell.sh {0}
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7

      - run: just lint

  doc-validate:
    defaults:
      run:
        shell: bash .github/vorpal-shell.sh {0}
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7

      - run: just doc-validate

  vuln-scan:
    defaults:
      run:
        shell: bash .github/vorpal-shell.sh {0}
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7

      - run: just vuln-scan

  build:
    defaults:
      run:
        shell: bash .github/vorpal-shell.sh {0}
    needs:
      - lint
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7

      - run: just build
