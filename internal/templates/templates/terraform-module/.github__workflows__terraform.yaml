# out of generation.

name: terraform

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      {{- if .HasDevTool "gitleaks" }}
        with:
          fetch-depth: 0
      - run: just secret-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}

  build:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    needs:
      - check
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      - run: just build
        shell: bash .github/vorpal-shell.sh {0}
