name: terraform

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}

  package:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    needs:
      - check
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      - run: just package
        shell: bash .github/vorpal-shell.sh {0}
      - run: echo "just package built the Vorpal dev environment (vorpal build --path 'dev'); it does not run terraform init or validate." >> "$GITHUB_STEP_SUMMARY"
        shell: bash .github/vorpal-shell.sh {0}
