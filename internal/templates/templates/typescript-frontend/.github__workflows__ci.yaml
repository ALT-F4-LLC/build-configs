---
# This file is generated by build-configs. Update it only through
# build-configs.yaml, then regenerate with `build-configs generate`.
# Do not edit it by hand. Listing a path in .bcignore opts that file
# out of generation.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: {{ .ForkGuardedIf "" }}
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      {{- if .HasDevTool "gitleaks" }}
        with:
          fetch-depth: 0
      - run: just secret-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .HasDevTool "rumdl" }}
      - run: just doc-validate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .Scripts.Test }}
      - run: just test
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}

  build:
    if: {{ .ForkGuardedIf "" }}
    needs:
      - check
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: just package "{{ .Name }}"
        shell: bash .github/vorpal-shell.sh {0}
