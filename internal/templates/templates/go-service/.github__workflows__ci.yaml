---
# This file is generated by build-configs. Update it only through
# build-configs.yaml, then regenerate with `build-configs generate`.
# Do not edit it by hand. Listing a path in .bcignore opts that file
# out of generation.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: {{ .ForkGuardedIf "" }}
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      {{- if .HasDevTool "gitleaks" }}
        with:
          fetch-depth: 0
      - run: just secret-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .HasDevTool "rumdl" }}
      - run: just doc-validate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{"{{"}} vars.ALTF4LLC_GITHUB_APP_CLIENT_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      - run: just lint
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: rm -f ~/.netrc
        if: always()
      {{- else }}
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- end }}

  build:
    if: {{ .ForkGuardedIf "" }}
    needs:
      - check
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{"{{"}} vars.ALTF4LLC_GITHUB_APP_CLIENT_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      {{- end }}
      {{- range .Artifacts }}
      - run: just package "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- range .Services }}
      - run: just package "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .Image.Repository }}
      - run: just package-image
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - run: rm -f ~/.netrc
        if: always()
      {{- end }}
      {{- if .Image.Repository }}
      # The push job takes the tarball from here, so the OIDC token never
      # reaches the job that runs the generators and the private module build.
      - if: {{ .PushIf }}
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: dist/{{ .ImageArtifact }}/image.tar
          if-no-files-found: error
          retention-days: 1

  push:
    if: {{ .PushJobIf }}
    # One push per ref at a time, so two pushes to main never load, tag and
    # push their images through the runner's Docker daemon together; queue: max
    # keeps every pending push, so no main commit goes without an image.
    concurrency:
      group: push-${{"{{"}} github.ref {{"}}"}}
      cancel-in-progress: false
      queue: max
    {{- if .Image.GithubEnvironment }}
    environment: "{{ .Image.GithubEnvironment }}"
    {{- end }}
    needs:
      - build
    # Only this job may request a GitHub OIDC token. The role's trust policy,
    # not this job's `if`, is the security boundary.
    permissions:
      contents: read
      id-token: write
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: dist/{{ .ImageArtifact }}
      # Build the Vorpal development environment before the role session
      # starts, so its 15 minutes cover only the login and the push.
      - run: just --version
        shell: bash .github/vorpal-shell.sh {0}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: {{ .Image.Region }}
          role-duration-seconds: 900
          role-to-assume: {{ .Image.RoleARN }}
      # docker/login-action fetches the ECR token with the role's credentials
      # and logs in with --password-stdin. The credential lives in a per-job
      # DOCKER_CONFIG under runner.temp, never in the runner's shared
      # ~/.docker/config.json.
      - env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
        uses: docker/login-action@v3
        with:
          logout: true
          registry: {{ .Registry }}
      - env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
          REGISTRY: {{ .Registry }}
          TAG: ${{"{{"}} github.sha {{"}}"}}
        run: just push "$REGISTRY" "$TAG"
        shell: bash .github/vorpal-shell.sh {0}
      - if: always()
        env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
          REGISTRY: {{ .Registry }}
        run: docker logout "$REGISTRY"
      {{- end }}
