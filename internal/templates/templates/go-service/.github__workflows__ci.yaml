---
# This file is generated by build-configs. Update it only through
# build-configs.yaml, then regenerate with `build-configs generate`.
# Do not edit it by hand. Listing a path in .bcignore opts that file
# out of generation.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: {{ .ForkGuardedIf "" }}
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      {{- if .HasDevTool "gitleaks" }}
        with:
          fetch-depth: 0
      - run: just secret-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .HasDevTool "rumdl" }}
      - run: just doc-validate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      {{- if .Clients }}
      - run: just clients
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      - run: just lint
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: rm -f ~/.netrc
        if: always()
      {{- else }}
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- end }}

  build:
    if: {{ .ForkGuardedIf "" }}
    {{- if .Image.Repository }}
    # One build per ref at a time, so two pushes to main never load, tag and
    # push their images through the runner's Docker daemon together.
    concurrency:
      group: build-${{"{{"}} github.ref {{"}}"}}
      cancel-in-progress: false
    {{- end }}
    needs:
      - check
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      {{- if and .Clients .Generate }}
      - run: just clients
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      {{- end }}
      {{- range .Artifacts }}
      - run: just package "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- range .Services }}
      - run: just package "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .Image.Repository }}
      - run: just package-image
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - run: rm -f ~/.netrc
        if: always()
      {{- end }}
      {{- if .Image.Repository }}
      # The registry credential lives in a per-job DOCKER_CONFIG under
      # runner.temp, never in the runner's shared ~/.docker/config.json.
      - if: {{ .PushIf }}
        env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
        uses: docker/login-action@v3
        with:
          logout: true
          password: ${{"{{"}} secrets.ALTF4LLC_DOCKER_REGISTRY_PASSWORD {{"}}"}}
          registry: ${{"{{"}} vars.ALTF4LLC_DOCKER_REGISTRY_URL {{"}}"}}
          username: ${{"{{"}} vars.ALTF4LLC_DOCKER_REGISTRY_USERNAME {{"}}"}}
      - if: {{ .PushIf }}
        env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
          REGISTRY: ${{"{{"}} vars.ALTF4LLC_DOCKER_REGISTRY_URL {{"}}"}}
          TAG: ${{"{{"}} github.sha {{"}}"}}
        run: just push "$REGISTRY" "$TAG"
        shell: bash .github/vorpal-shell.sh {0}
      - if: {{ .PushIfAlways }}
        env:
          DOCKER_CONFIG: ${{"{{"}} runner.temp {{"}}"}}/docker
          REGISTRY: ${{"{{"}} vars.ALTF4LLC_DOCKER_REGISTRY_URL {{"}}"}}
        run: docker logout "$REGISTRY"
      {{- end }}
