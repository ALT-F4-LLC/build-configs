{{- $envLength := len .GitHub.Env -}}
# This file is generated by build-configs. Update it only through
# build-configs.yaml, then regenerate with `build-configs generate`.
# Do not edit it by hand. Listing a path in .bcignore opts that file
# out of generation.

name: terraform

on:
  pull_request:
  push:
    branches:
      - main
  {{- if .Schedule }}
  schedule:
    - cron: "{{ .Schedule }}"
  {{- end }}
  workflow_dispatch:

jobs:
  check:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    permissions:
      contents: read
    runs-on: {{ .GitHub.RunsOn }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: just check
      shell: bash .github/vorpal-shell.sh {0}

  plan:
    concurrency:
      cancel-in-progress: false
      group: tf-lock
    {{- if gt $envLength 0 }}
    env:
    {{- range $key, $value := .GitHub.Env }}
      {{ $key }}: {{ $value }}
    {{- end }}
    {{- end }}
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    needs: check
    permissions:
      contents: read
      id-token: write
    runs-on: {{ .GitHub.RunsOn }}
    steps:
    {{- if .GitHub.Action.SetupDeployKey }}
    - id: deploy-key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{"{{"}} secrets.ALTF4LLC_DEPLOY_KEY {{"}}"}}
        known_hosts: unnecessary
        name: id_rsa
    {{- end }}
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        aws-region: us-west-2
        role-to-assume: {{ .Role.PlanARN }}
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - run: aws sts get-caller-identity
      shell: bash .github/vorpal-shell.sh {0}
    - run: just init
      shell: bash .github/vorpal-shell.sh {0}
    - run: just validate
      shell: bash .github/vorpal-shell.sh {0}
    - run: just plan
      shell: bash .github/vorpal-shell.sh {0}
    - uses: actions/upload-artifact@v7
      with:
        name: tf-plan
        path: terraform.tfplan
    {{- if .GitHub.Action.SetupDeployKey }}
    - env:
        KEY_OUTCOME: ${{"{{"}} steps.deploy-key.outcome {{"}}"}}
      if: always()
      run: if [ "$KEY_OUTCOME" = success ]; then rm -f "$HOME/.ssh/id_rsa"; fi
      shell: bash
    {{- end }}

  apply:
    concurrency:
      cancel-in-progress: false
      group: tf-lock
    environment:
      name: prod
    {{- if gt $envLength 0 }}
    env:
    {{- range $key, $value := .GitHub.Env }}
      {{ $key }}: {{ $value }}
    {{- end }}
    {{- end }}
    if: ${{"{{"}} (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.ref == 'refs/heads/main') {{"}}"}}
    needs: plan
    permissions:
      contents: read
      id-token: write
    runs-on: {{ .GitHub.RunsOn }}
    steps:
    {{- if .GitHub.Action.SetupDeployKey }}
    - id: deploy-key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{"{{"}} secrets.ALTF4LLC_DEPLOY_KEY {{"}}"}}
        known_hosts: unnecessary
        name: id_rsa
    {{- end }}
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        audience: sts.amazonaws.com
        aws-region: us-west-2
        role-to-assume: {{ .Role.ApplyARN }}
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: tf-plan
    - run: aws sts get-caller-identity
      shell: bash .github/vorpal-shell.sh {0}
    - run: just init
      shell: bash .github/vorpal-shell.sh {0}
    - run: just apply
      shell: bash .github/vorpal-shell.sh {0}
    {{- if .GitHub.Action.SetupDeployKey }}
    - env:
        KEY_OUTCOME: ${{"{{"}} steps.deploy-key.outcome {{"}}"}}
      if: always()
      run: if [ "$KEY_OUTCOME" = success ]; then rm -f "$HOME/.ssh/id_rsa"; fi
      shell: bash
    {{- end }}
