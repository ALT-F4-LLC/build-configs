name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v7
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}

  build:
    if: ${{"{{"}} github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository {{"}}"}}
    needs:
      - check
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      {{- if .PrivateModules }}
      - id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v2
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      {{- end }}
      - uses: actions/checkout@v7
      {{- if .PrivateModules }}
      - run: cp --no-preserve=mode ~/.netrc /tmp/.netrc
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: just build
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .PrivateModules }}
      - if: always()
        run: rm -f /tmp/.netrc
      - if: always()
        run: rm -f ~/.netrc
      {{- end }}
