---
# This file is generated by build-configs. Update it only through
# build-configs.yaml, then regenerate with `build-configs generate`.
# Do not edit it by hand. Listing a path in .bcignore opts that file
# out of generation.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: {{ .ForkGuardedIf "" }}
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      {{- if .HasDevTool "gitleaks" }}
        with:
          fetch-depth: 0
      - run: just secret-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .HasDevTool "rumdl" }}
      - run: just doc-validate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if and .OpenAPI.Enable .OpenAPI.GenerateInCI }}
      - run: just build-client
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .OpenAPI.Module }}
      - run: just check-client
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{"{{"}} vars.ALTF4LLC_GITHUB_APP_CLIENT_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      - run: just lint
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: rm -f ~/.netrc
        if: always()
      {{- else }}
      {{- if .OpenAPI.Module }}
      - run: just check-client
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}
      {{- if .HasDevTool "govulncheck" }}
      - run: just vuln-scan
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- end }}
{{- if or .Lambdas .Services .Artifacts }}

  build:
    if: {{ .ForkGuardedIf "" }}
    needs:
      - check
    permissions:
      contents: read
{{- if .NeedsVorpalSetup }}
      id-token: write
{{- end }}
    runs-on: {{ .Runner }}
    steps:
{{- if .NeedsVorpalSetup }}
{{ .VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      {{- if .Generate }}
      - run: just generate
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if and .OpenAPI.Enable .OpenAPI.GenerateInCI }}
      - run: just build-client
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{"{{"}} vars.ALTF4LLC_GITHUB_APP_CLIENT_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v3
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      {{- end }}
      {{- range .Artifacts }}
      - run: just package-artifact "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- range .Services }}
      - run: just package-artifact "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- range .Lambdas }}
      - run: just package "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
      {{- if .PrivateModules }}
      - run: rm -f ~/.netrc
        if: always()
      {{- end }}
      {{- range .Lambdas }}
      - uses: actions/upload-artifact@v7
        with:
          name: "zip-{{ . }}"
          path: "dist/{{ . }}/lambda.zip"
          if-no-files-found: error
          retention-days: 7
      {{- end }}
  {{ range .Deploy }}
  deploy-{{ .Environment }}:
    if: {{ $.ForkGuardedIf .If }}
    {{- if .GithubEnvironment }}
    environment: {{ .GithubEnvironment }}
    {{- end }}
    permissions:
      id-token: write
      contents: read
    needs:
      - build
    concurrency:
      group: deploy-{{ .Environment }}
      cancel-in-progress: false
      queue: max
    runs-on: {{ $.Runner }}
    steps:
{{- if $.NeedsVorpalSetup }}
{{ $.VorpalSetupStep 6 }}
{{- end }}
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: {{ .Region }}
          role-to-assume: {{ .RoleARN }}
      {{- range $.Lambdas }}
      - uses: actions/download-artifact@v8
        with:
          name: "zip-{{ . }}"
          path: "dist/{{ . }}"
      {{- end }}
      {{- $env := .Environment }}
      {{- range $.Lambdas }}
      - run: just deploy {{ $env }} "{{ . }}"
        shell: bash .github/vorpal-shell.sh {0}
      {{- end }}
  {{- end }}
{{- end }}
