---
name: Check, Build, Deploy*

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: {{ .ForkGuardedIf "" }}
    permissions:
      contents: read
    runs-on: altf4llc
    steps:
      - uses: actions/checkout@v4
      - run: just check
        shell: bash .github/vorpal-shell.sh {0}

  build:
    if: {{ .ForkGuardedIf "" }}
    needs:
      - check
    permissions:
      contents: read
    runs-on: altf4llc
    strategy:
      matrix:
        profile:
          {{- range .Lambdas }}
          - {{ . }}
          {{- end }}
    steps:
      - uses: actions/checkout@v4
      {{- if .PrivateModules }}
      - id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_ID {{"}}"}}
          owner: ${{"{{"}} github.repository_owner {{"}}"}}
          private-key: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_PRIVATE_KEY {{"}}"}}
      - uses: extractions/netrc@v2
        with:
          machine: github.com
          password: ${{"{{"}} steps.generate-token.outputs.token {{"}}"}}
          username: ${{"{{"}} secrets.ALTF4LLC_GITHUB_APP_USER {{"}}"}}
      - run: cp --no-preserve=mode ~/.netrc /tmp/.netrc
      {{- end }}
      - run: just build "${{"{{"}} matrix.profile {{"}}"}}"
        shell: bash .github/vorpal-shell.sh {0}
      - run: just package "${{"{{"}} matrix.profile {{"}}"}}"
        shell: bash .github/vorpal-shell.sh {0}
      - uses: actions/upload-artifact@v4
        with:
          name: "zip-${{"{{"}} matrix.profile {{"}}"}}"
          path: "dist/${{"{{"}} matrix.profile {{"}}"}}/lambda.zip"
          if-no-files-found: error
          retention-days: 7
      {{- if .PrivateModules }}
      - run: rm -f /tmp/.netrc
        if: always()
      - run: rm -f ~/.netrc
        if: always()
      {{- end }}
  {{ range .Deploy }}
  deploy-{{ .Environment }}:
    if: {{ $.ForkGuardedIf .If }}
    permissions:
      id-token: write
      contents: read
    needs: build
    runs-on: altf4llc
    strategy:
      matrix:
        profile:
          {{- range $.Lambdas }}
          - {{ . }}
          {{- end }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: {{ .Region }}
          role-to-assume: {{ .RoleARN }}
      - uses: actions/download-artifact@v4
        with:
          name: "zip-${{"{{"}} matrix.profile {{"}}"}}"
          path: "dist/${{"{{"}} matrix.profile {{"}}"}}/lambda.zip"
      - run: just deploy {{ .Environment }} "${{"{{"}} matrix.profile {{"}}"}}"
        shell: bash .github/vorpal-shell.sh {0}
  {{- end }}
