---
name: project-name
template: go-lambda
parameters:
  lambdas:
    - lambda1
    - lambda2
  privateModules: "github.com/ALT-F4-LLC/quirk-service-kit"
  quirk:
    service: lambdatest
  deploy:
    - environment: dev
      if: github.ref == 'refs/heads/main'
  openapi:
    enable: true
    # Optional: publish the client as a Go module other repositories import.
    # output: client/lambdatest
    # module: github.com/ALT-F4-LLC/project-name/client/lambdatest
  # Optional: shell lines for a `generate` recipe that `check` depends on.
  # generate:
  #   - just build-data
  # Optional: Lambda function name as a just string (default quirk-{{ environment }}-<service>-{{ lambda }}).
  # functionName: "example-{{ lambda }}"
  # Optional: extra Vorpal artifacts CI builds with `just package-artifact <name>`.
  # artifacts:
  #   - example-client
  # Per deploy entry, `githubEnvironment: prod` runs that job in a GitHub environment.
  # Optional: narrow every lambda and service Vorpal source to these paths.
  # The top-level dist/ directory stays excluded either way. List every path
  # the build compiles or embeds, such as the OpenAPI client under pkg/.
  # vorpal:
  #   includes:
  #     - cmd
  #     - internal
  #     - pkg
  #     - go.mod
  #     - go.sum
