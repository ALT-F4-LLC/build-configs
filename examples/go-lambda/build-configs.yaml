---
name: project-name
template: go-lambda
parameters:
  lambdas:
    - lambda1
    - lambda2
  privateModules: "github.com/ALT-F4-LLC/quirk-service-kit"
  quirk:
    service: lambdatest
  deploy:
    - environment: dev
      if: github.ref == 'refs/heads/main'
  openapi:
    enable: true
  # Optional: shell lines for a `generate` recipe that `check` depends on.
  # generate:
  #   - just build-data
  # Optional: Lambda function name as a just string (default quirk-{{ environment }}-<service>-{{ lambda }}).
  # functionName: "example-{{ lambda }}"
  # Optional: extra Vorpal artifacts CI builds with `just build <name>`.
  # artifacts:
  #   - example-client
  # Per deploy entry, `githubEnvironment: prod` runs that job in a GitHub environment.
